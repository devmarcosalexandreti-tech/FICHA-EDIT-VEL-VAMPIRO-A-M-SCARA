name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install ".[test]"
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: python -W error -m compileall -q -f src scripts tests
      - run: coverage run --branch -m unittest discover -s tests -p "test_*.py" -v
      - run: coverage report --fail-under=95
      - run: node --test tests/test_calculations.js
      - run: python scripts/build_sheet.py
      - run: python scripts/validate_sheet.py
