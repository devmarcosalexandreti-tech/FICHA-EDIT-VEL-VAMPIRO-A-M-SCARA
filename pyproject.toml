[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ficha-vampiro-interativa"
version = "0.2.0"
description = "Gerador de ficha A4 preenchivel para Vampiro: A Mascara 3a edicao"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.7,<7",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
test = [
    "coverage>=7,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vampiro_sheet = ["calculations.js"]

[tool.coverage.run]
branch = true
source = ["src/vampiro_sheet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
